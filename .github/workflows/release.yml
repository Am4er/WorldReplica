name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check the tag matches the version
        run: |
          version=$(grep '^worldReplicaVersion=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in gradle.properties"
            exit 1
          fi

      - name: Build
        run: ./gradlew build :fabric:runGameTest

      - name: Release notes
        run: |
          awk -v heading="## ${GITHUB_REF_NAME#v}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" fabric/build/libs/worldreplica-*+*.jar --title "WorldReplica ${GITHUB_REF_NAME#v}" --notes-file notes.md
